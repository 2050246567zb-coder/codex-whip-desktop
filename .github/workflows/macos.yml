name: macOS build and UI regression
on:
  workflow_dispatch:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  apple-silicon:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Record environment
        run: |
          mkdir -p macos/test-results
          sw_vers | tee macos/test-results/environment.txt
      - name: Python with native Tk
        run: |
          brew install python@3.12 python-tk@3.12
          echo "CODEX_WHIP_PYTHON=$(brew --prefix python@3.12)/bin/python3.12" >> "$GITHUB_ENV"
      - name: Build native app
        run: bash macos/build-macos.sh
      - name: Install test tools
        run: macos/.venv-macos/bin/python -m pip install -e 'desktop[dev]'
      - name: Normal packaged startup with native features (no mocks)
        run: macos/.venv-macos/bin/python macos/test-normal-startup.py
      - name: Launch packaged UI with synthetic inputs (no BLE or sending)
        run: macos/dist/CodexWhip.app/Contents/MacOS/CodexWhip --ui-smoke --output "$PWD/macos/test-results/ui"
      - name: UI and animation regression (isolated processes)
        shell: bash
        run: |
          mkdir -p macos/test-results
          failed=0
          for suite in interface interface_state hover_clock morphing_title voice_presentation voice_expiry tick_slider settings_window mount_calibration_window effects macos_sender cloud_speech speech_settings recognizing_pose voice whip_sensitivity target_app overlay_presentation; do
            macos/.venv-macos/bin/python -m pytest "desktop/tests/test_${suite}.py" --junitxml="macos/test-results/${suite}.xml" || failed=1
          done
          exit "$failed"
      - name: Save build and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CodexWhip-macOS-Apple-Silicon
          retention-days: 7
          path: |
            macos/dist/*.dmg
            macos/dist/*.zip
            macos/test-results/*.txt
            macos/test-results/*.xml
            macos/test-results/ui/
            macos/test-results/startup/

  latest-os:
    needs: apple-silicon
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: CodexWhip-macOS-Apple-Silicon
          path: downloaded
      - name: Unpack identical 2.2.32 package and record OS
        run: |
          mkdir -p macos/dist macos/test-results
          sw_vers | tee macos/test-results/environment.txt
          uname -m | tee -a macos/test-results/environment.txt
          package=$(find downloaded -name 'CodexWhip-2.2.32-Apple-Silicon.zip' -print -quit)
          test -n "$package"
          shasum -a 256 "$package" | tee macos/test-results/package-sha256.txt
          ditto -x -k "$package" macos/dist
          codesign --verify --deep --strict --verbose=2 macos/dist/CodexWhip.app
      - name: Normal startup
        run: python3 macos/test-normal-startup.py
      - name: Packaged UI animation smoke
        if: ${{ !cancelled() }}
        run: macos/dist/CodexWhip.app/Contents/MacOS/CodexWhip --ui-smoke --output "$PWD/macos/test-results/ui"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CodexWhip-2.2.32-macOS27-evidence
          retention-days: 7
          path: macos/test-results/

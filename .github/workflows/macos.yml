name: macOS build and UI regression
on:
  workflow_dispatch:
  push:
    branches: [master, codex/product-macos]
permissions:
  contents: read
jobs:
  apple-silicon:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Python with native Tk
        run: |
          brew install python@3.12 python-tk@3.12 cmake
          echo "CODEX_WHIP_PYTHON=$(brew --prefix python@3.12)/bin/python3.12" >> "$GITHUB_ENV"
      - name: Verify Mac firmware voice activity
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror firmware/tests/voice_activity_test.cpp -o /tmp/voice-activity-test
          /tmp/voice-activity-test
      - name: Build native app
        env:
          CODEX_WHIP_DOUBAO_API_KEY: ${{ secrets.CODEX_WHIP_DOUBAO_API_KEY }}
        run: bash macos/build-macos.sh
      - name: Install test tools
        run: macos/.venv-macos/bin/python -m pip install -e 'desktop[dev]'
      - name: Launch packaged UI with synthetic inputs (no BLE or sending)
        run: macos/dist/CodexWhip.app/Contents/MacOS/CodexWhip --ui-smoke --output "$PWD/macos/test-results/ui"
      - name: UI and animation regression (isolated processes)
        shell: bash
        run: |
          mkdir -p macos/test-results
          failed=0
          for suite in interface interface_state paths_migration hover_clock morphing_title sleep_pose voice_presentation voice_expiry voice_replay cloud_speech recognition_history tick_slider settings_window mount_calibration_window effects sensor_pose sensor_bias power_settings macos_overlay overlay_presentation pose_presentation ble_client voice macos_sender virtual_microphone audio_driver_installer; do
            macos/.venv-macos/bin/python -m pytest "desktop/tests/test_${suite}.py" --junitxml="macos/test-results/${suite}.xml" || failed=1
          done
          exit "$failed"
      - name: Save build and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CodexWhip-macOS-Apple-Silicon
          retention-days: 7
          path: |
            macos/dist/*.dmg
            macos/dist/*.zip
            macos/test-results/*.xml
            macos/test-results/ui/

name: Windows product build
on:
  workflow_dispatch:
  push:
    branches: [codex/product-windows]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify shared firmware matches macOS product branch
        shell: pwsh
        run: |
          git fetch --no-tags origin codex/product-macos
          python scripts/verify-shared-firmware.py origin/codex/product-macos
      - name: Install and test
        shell: pwsh
        run: |
          python -m pip install -e "desktop[dev,build]"
          python -m pytest desktop/tests -q
      - name: Build product
        shell: pwsh
        env:
          CODEX_WHIP_DOUBAO_API_KEY: ${{ secrets.CODEX_WHIP_DOUBAO_API_KEY }}
        run: |
          if ($env:CODEX_WHIP_DOUBAO_API_KEY) {
            $private = Join-Path (Resolve-Path desktop/assets).Path "private"
            New-Item -ItemType Directory -Force -Path $private | Out-Null
            Set-Content -LiteralPath (Join-Path $private "doubao-api-key.txt") -Value $env:CODEX_WHIP_DOUBAO_API_KEY -NoNewline
          }
          $source = (Resolve-Path desktop/src).Path
          $assets = (Resolve-Path desktop/assets).Path
          $entry = (Resolve-Path desktop/codex_whip_gui.py).Path
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name "产品版-Windows-2.2.64" --paths $source --add-data "${assets};assets" --collect-all bleak --collect-all pywinauto --collect-all sounddevice --exclude-module pytest --distpath dist --workpath build/pyinstaller --specpath build/pyinstaller-spec $entry
      - uses: actions/upload-artifact@v4
        with:
          name: CodexWhip-Windows-2.2.64
          path: dist/产品版-Windows-2.2.64.exe
          retention-days: 14

name: Existing Mac package on latest macOS
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  compatibility:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Record actual environment
        run: |
          mkdir -p macos/test-results
          sw_vers | tee macos/test-results/environment.txt
          uname -m | tee -a macos/test-results/environment.txt
          xcodebuild -version | tee -a macos/test-results/environment.txt
      - name: Download previously delivered 2.2.28 package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 35317276597 --name CodexWhip-macOS-Apple-Silicon --dir previous-artifact
          mkdir -p macos/dist
          package=$(find previous-artifact -name 'CodexWhip-2.2.28-Apple-Silicon.zip' -print -quit)
          test -n "$package"
          shasum -a 256 "$package" | tee macos/test-results/package-sha256.txt
          ditto -x -k "$package" macos/dist
          codesign --verify --deep --strict --verbose=2 macos/dist/CodexWhip.app
      - name: Normal packaged startup
        run: python3 macos/test-normal-startup.py
      - name: Packaged UI animations with synthetic inputs
        if: ${{ !cancelled() }}
        run: macos/dist/CodexWhip.app/Contents/MacOS/CodexWhip --ui-smoke --output "$PWD/macos/test-results/ui"
      - name: Preserve crash reports
        if: always()
        run: |
          mkdir -p macos/test-results/crashes
          find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 -name '*CodexWhip*' -exec cp {} macos/test-results/crashes/ \; 2>/dev/null || true
      - name: Save evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macOS-27-compatibility-evidence
          retention-days: 7
          path: macos/test-results/
